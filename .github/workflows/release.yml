name: Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            bin: blaris
            asset: blaris-linux-x86_64
            cflags: -O3 -DNDEBUG -Wall -Wextra
          - target: linux-arm64
            os: ubuntu-24.04-arm
            bin: blaris
            asset: blaris-linux-arm64
            cflags: -O3 -DNDEBUG -Wall -Wextra
          - target: macos-arm64
            os: macos-latest
            bin: blaris
            asset: blaris-macos-arm64
            cflags: -O3 -DNDEBUG -Wall -Wextra
          - target: macos-x86_64
            os: macos-15-intel
            bin: blaris
            asset: blaris-macos-x86_64
            cflags: -O3 -DNDEBUG -Wall -Wextra
          - target: windows-x86_64
            os: windows-latest
            bin: blaris.exe
            asset: blaris-windows-x86_64.exe
            cflags: -O3 -DNDEBUG -Wall -Wextra -static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CLI
        shell: bash
        run: |
          make -C cli -j CC=gcc TARGET="${{ matrix.bin }}" CFLAGS="${{ matrix.cflags }}"

      - name: Smoke test
        shell: bash
        run: |
          ./cli/${{ matrix.bin }} -5 README.md test.bls
          ./cli/${{ matrix.bin }} -d -5 test.bls test.out
          cmp README.md test.out
          rm -f test.bls test.out

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "cli/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum blaris-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
